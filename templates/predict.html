<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Risk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <h1 class="logo">Heart Disease Risk Predictor</h1>
            <nav>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('predict') }}">Predict</a>
                <a href="{{ url_for('history') }}">History</a>
            </nav>
        </div>
    </header>

    <main class="page-section">
        <div class="container">
            <div class="card">
                <h2>Patient Risk Prediction Form</h2>
                <p class="subtitle">Enter the patient clinical information below.</p>

                <form action="{{ url_for('predict') }}" method="POST" class="prediction-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" name="age" required min="1">
                        </div>

                        <div class="form-group">
                            <label for="sex">Sex</label>
                            <select id="sex" name="sex" required>
                                <option value="">Select</option>
                                <option value="1">Male</option>
                                <option value="0">Female</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="cp">Chest Pain Type (cp)</label>
                            <select id="cp" name="cp" required>
                                <option value="">Select</option>
                                <option value="1">Typical Angina</option>
                                <option value="2">Atypical Angina</option>
                                <option value="3">Non-anginal Pain</option>
                                <option value="4">Asymptomatic</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="trestbps">Resting Blood Pressure</label>
                            <input type="number" id="trestbps" name="trestbps" required step="0.1">
                        </div>

                        <div class="form-group">
                            <label for="chol">Cholesterol</label>
                            <input type="number" id="chol" name="chol" required step="0.1">
                        </div>

                        <div class="form-group">
                            <label for="fbs">Fasting Blood Sugar > 120 mg/dl</label>
                            <select id="fbs" name="fbs" required>
                                <option value="">Select</option>
                                <option value="1">True</option>
                                <option value="0">False</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="restecg">Resting ECG</label>
                            <select id="restecg" name="restecg" required>
                                <option value="">Select</option>
                                <option value="0">Normal</option>
                                <option value="1">ST-T Wave Abnormality</option>
                                <option value="2">Left Ventricular Hypertrophy</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="thalach">Maximum Heart Rate Achieved</label>
                            <input type="number" id="thalach" name="thalach" required step="0.1">
                        </div>

                        <div class="form-group">
                            <label for="exang">Exercise Induced Angina</label>
                            <select id="exang" name="exang" required>
                                <option value="">Select</option>
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="oldpeak">Oldpeak</label>
                            <input type="number" id="oldpeak" name="oldpeak" required step="0.1">
                        </div>

                        <div class="form-group">
                            <label for="slope">Slope</label>
                            <select id="slope" name="slope" required>
                                <option value="">Select</option>
                                <option value="1">Upsloping</option>
                                <option value="2">Flat</option>
                                <option value="3">Downsloping</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="ca">Number of Major Vessels (ca)</label>
                            <select id="ca" name="ca" required>
                                <option value="">Select</option>
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="thal">Thal</label>
                            <select id="thal" name="thal" required>
                                <option value="">Select</option>
                                <option value="3">Normal</option>
                                <option value="6">Fixed Defect</option>
                                <option value="7">Reversible Defect</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn primary-btn">Predict Risk</button>
                        <a href="{{ url_for('home') }}" class="btn secondary-btn">Back Home</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
